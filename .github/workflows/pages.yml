name: Deploy live site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm test
      - name: Build browser-only live site
        run: node scripts/export-demo-seed.js && npm run build --prefix client
        env:
          VITE_DEMO: "1"
          VITE_BASE: /CLASS-AR-HR-1/
      - run: cp client/dist/index.html client/dist/404.html && touch client/dist/.nojekyll
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: client/dist
          force_orphan: true
